<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        @keyframes hareket {
            0%{margin-left: 110%; transform: rotate(0deg);}
            100%{margin-left: -10%; transform: rotate(-720deg);}
        }
        @keyframes sicra {
            0%{margin-top: 98px;}
            50%{margin-top: 15px;}
            100%{margin-top: 98px;}
        }
        body{
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .g-container{
            width: 100%;
            height: 150px;
            overflow: hidden;
            position: relative;
        }
        .g-container .karakter{
            width: 50px;
            height: 50px;
            border: 1px solid black;
            position: absolute;
            margin-top: 98px;
            margin-left: 400px;
        }
        .g-container .engel{
            width: 50px;
            height: 50px;
            border: 1px solid black;
            position: absolute;
            margin-top: 96px;
            animation: hareket 1.5s linear infinite;
            border-radius: 20px;
            box-shadow: 1px 1px 10px palevioletred;
        }
        @media only screen and (max-width: 764px) {
            @keyframes sicra {
                0%{margin-top: 98px;}
                50%{margin-top: 40px;}
                100%{margin-top: 98px;}
            }
            body{
                height: var(--vh);
            }
            .g-container{
                width: 100%;
            }
            .g-container .karakter{
                width: 30px;
                height: 30px;
                margin-left: 100px;
            }
            .g-container .engel{
                width: 30px;
                height: 30px;
                border-radius: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="g-container">
        <div class="karakter"></div>
        <div class="engel"></div>
    </div>
    <script>
        let karakter = document.querySelector(".karakter");
        let engel = document.querySelector(".engel");

        window.addEventListener("load", function(){
            document.documentElement.style.setProperty("--vh", window.innerHeight + "px");
        });

        document.addEventListener("keydown", function(event){
            if(event.key === " " || event.keyCode === 38){
                karakter.style.animation = "sicra 0.6s";
                setTimeout(function(){
                    karakter.style.animation = "";
                },600);
            }
        });

        document.addEventListener("click", function(){
            karakter.style.animation = "sicra 0.6s";
                setTimeout(function(){
                    karakter.style.animation = "";
                },600);
        });

        function kont(karakter, engel){
            let karakterRect = karakter.getBoundingClientRect();
            let engelRect = engel.getBoundingClientRect();

            if(karakterRect.right > engelRect.left &&
               karakterRect.left < engelRect.right &&
               karakterRect.bottom > engelRect.top &&
               karakterRect.top < engelRect.bottom) {
                return true;
            } else {
                return false;
            }
        }

        setInterval(function(){
            if(kont(karakter, engel)){
                karakter.style.border = "1px solid red";
            } else {
                karakter.style.border = "1px solid black";
            }
        }, 100);
    </script>
</body>
</html>
